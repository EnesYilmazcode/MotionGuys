<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">MotionGuys course layout</title>
  <desc id="desc">Eight runners start at the left, then pass a vault wall, a low ceiling, a gap, and the finish.</desc>
  <rect width="1120" height="480" rx="20" fill="#101b2c"/>
  <g font-family="Arial,sans-serif" fill="#eff5f9">
    <text x="52" y="66" font-size="32" font-weight="700">MotionGuys</text>
    <text x="52" y="96" font-size="17" fill="#9cacbf">The first course</text>
    <rect x="52" y="150" width="1016" height="244" rx="14" fill="#edf0e0"/>
    <path d="M52 211H1068M52 272H1068M52 333H1068" stroke="#cbd3c5" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="106" y="150" width="12" height="244" fill="#b8f153"/>
    <rect x="340" y="150" width="24" height="244" fill="#fb7ca8"/>
    <rect x="541" y="150" width="112" height="244" fill="#8faaff"/>
    <rect x="796" y="150" width="65" height="244" fill="#101b2c"/>
    <path d="M998 150V394" stroke="#25354a" stroke-width="18" stroke-dasharray="12 12"/>
    <g font-size="15" text-anchor="middle" fill="#9cacbf">
      <text x="112" y="431">START</text><text x="352" y="431">VAULT</text><text x="597" y="431">DUCK</text><text x="828" y="431">JUMP</text><text x="998" y="431">FINISH</text>
    </g>
    <g stroke="#25354a" stroke-width="3">
      <circle cx="81" cy="172" r="10" fill="#b8f153"/><circle cx="81" cy="200" r="10" fill="#fb7ca8"/>
      <circle cx="81" cy="228" r="10" fill="#8faaff"/><circle cx="81" cy="256" r="10" fill="#ffb25b"/>
      <circle cx="81" cy="284" r="10" fill="#65dce5"/><circle cx="81" cy="312" r="10" fill="#ce96ff"/>
      <circle cx="81" cy="340" r="10" fill="#f0e579"/><circle cx="81" cy="368" r="10" fill="#ff7e69"/>
    </g>
  </g>
</svg>
