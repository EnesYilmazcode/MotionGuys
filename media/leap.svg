<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Upstream jump compared with the MotionGuys leap</title>
  <desc id="d">The upstream jump runs about 3.9 metres to an entry target before leaving the ground. The leap skips that target, goes straight to the airborne target, and moves the landing target farther out.</desc>
  <rect width="760" height="330" fill="#ffffff"/>

  <text x="24" y="34" font-size="16" font-weight="700" fill="#16233a">Upstream jump</text>
  <text x="24" y="54" font-size="13" fill="#51607a">Feet leave about 2.2 s after the start and clear about 0.6 m</text>
  <line x1="24" y1="130" x2="736" y2="130" stroke="#8592a6" stroke-width="2"/>
  <rect x="470" y="130" width="60" height="10" fill="#1b2a4a"/>
  <path d="M 70 130 L 390 130 C 440 130 465 74 500 74 C 535 74 560 130 610 130 L 690 130" fill="none" stroke="#51607a" stroke-width="2.5"/>
  <circle cx="70" cy="130" r="6" fill="#51607a"/>
  <text x="70" y="158" font-size="12" text-anchor="middle" fill="#51607a">start</text>
  <circle cx="390" cy="130" r="7" fill="#d9822b"/>
  <text x="390" y="158" font-size="12" text-anchor="middle" fill="#d9822b">entry target</text>
  <circle cx="500" cy="74" r="7" fill="#2f6fde"/>
  <text x="500" y="64" font-size="12" text-anchor="middle" fill="#2f6fde">airborne target</text>
  <circle cx="610" cy="130" r="7" fill="#2a9d6f"/>
  <text x="610" y="158" font-size="12" text-anchor="middle" fill="#2a9d6f">landing target</text>

  <text x="24" y="196" font-size="16" font-weight="700" fill="#16233a">MotionGuys leap</text>
  <text x="24" y="216" font-size="13" fill="#51607a">Feet leave about 0.6 s after the decision and clear a full missing tile</text>
  <line x1="24" y1="292" x2="240" y2="292" stroke="#8592a6" stroke-width="2"/>
  <line x1="400" y1="292" x2="736" y2="292" stroke="#8592a6" stroke-width="2"/>
  <rect x="240" y="292" width="160" height="10" fill="#1b2a4a"/>
  <text x="320" y="320" font-size="12" text-anchor="middle" fill="#1b2a4a">gap</text>
  <path d="M 70 292 C 150 292 190 236 250 236 C 330 236 390 292 470 292 L 690 292" fill="none" stroke="#51607a" stroke-width="2.5"/>
  <circle cx="70" cy="292" r="6" fill="#51607a"/>
  <text x="70" y="320" font-size="12" text-anchor="middle" fill="#51607a">start</text>
  <circle cx="250" cy="236" r="7" fill="#2f6fde"/>
  <text x="264" y="240" font-size="12" fill="#2f6fde">airborne target, 2.2 m ahead</text>
  <circle cx="470" cy="292" r="7" fill="#2a9d6f"/>
  <text x="470" y="320" font-size="12" text-anchor="middle" fill="#2a9d6f">landing target, moved 2.4 m out</text>
</svg>
